[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carina"
version = "0.8.0"
description = "Carina — planetário desktop estilo Stellarium em Python (PySide6 + OpenGL + Skyfield)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "André Serpa" }]
dependencies = [
    "PySide6>=6.8",
    "numpy>=1.26",
    "skyfield>=1.49",
    "PyOpenGL>=3.1.7",
    "requests>=2.31",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.10",
]

[project.gui-scripts]
carina = "carina.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
